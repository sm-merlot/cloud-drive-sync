name: Obsidian Plugin Release

# Bare-version tags (e.g. "1.0.5") only — the Tauri app uses its own
# "tauri-app-v*" tag namespace with a separate workflow, since this is now a
# monorepo shipping two independently-versioned artifacts.
on:
  push:
    tags-ignore:
      - "tauri-app-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: homelab-2gb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace=packages/obsidian-plugin

      - name: Read core version
        id: core_version
        run: echo "version=$(node -p "require('./packages/core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            Cloud Drive Sync Obsidian Plugin ${{ github.ref_name }}

            Core version: ${{ steps.core_version.outputs.version }}
          files: |
            packages/obsidian-plugin/main.js
            packages/obsidian-plugin/manifest.json
            packages/obsidian-plugin/styles.css
